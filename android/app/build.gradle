plugins { id 'com.android.application' }
android {
 namespace 'ai.learnharness.mobile'
 compileSdk 36
 defaultConfig { applicationId 'ai.learnharness.mobile'; minSdk 26; targetSdk 36; versionCode 102; versionName '0.4.1-custom.2'; externalNativeBuild { cmake { cppFlags '-std=c++20'; arguments '-DANDROID_STL=c++_shared' } } }
 buildFeatures { buildConfig true }
 ndkVersion '28.2.13676358'
 if(project.hasProperty('androidNdk')) ndkPath project.property('androidNdk')
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
 splits { abi { enable true; reset(); include 'arm64-v8a','x86_64'; universalApk false } }
 packaging { jniLibs { useLegacyPackaging false; keepDebugSymbols += ['**/libnode.so'] } }
 buildTypes {
  debug { debuggable true }
  release { minifyEnabled false; signingConfig signingConfigs.debug }
 }
}
